[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mivta"
version = "0.2.1"
description = "Minimalist Telegram Inline & Secretary Mode translator bot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.16"
authors = [{ name = "RUdolf1517" }]
dependencies = [
    "aiogram>=3.13,<4.0; python_version < '3.15'",
    "aiogram @ git+https://github.com/aiogram/aiogram.git@e164475d00dcbc607da4bfca3f8154cad800028f ; python_version >= '3.15'",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
mivta = "mivta.__main__:main"

[tool.setuptools.packages.find]
include = ["mivta*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
