[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mivta"
version = "0.3.0"
description = "Minimalist Telegram Inline & Secretary Mode translator bot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiogram>=3.7,<4.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
mivta = "mivta.bot:main"

[tool.setuptools.packages.find]
include = ["mivta*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
