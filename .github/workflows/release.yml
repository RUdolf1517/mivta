name: Release

# Verifies tag consistency and the full offline test suite, attaches wheel/sdist
# + SHA256SUMS to the GitHub Release, and publishes multi-arch (amd64 + arm64)
# container images to ghcr.io/rudolf1517/mivta.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish artifacts for (e.g. v0.3.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-artifacts:
    name: Wheel, sdist & SHA256SUMS
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve target tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "No release tag provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Check install.sh with ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck install.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Verify package version matches tag
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(python -c 'import mivta; print(mivta.__version__)')"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "mivta.__version__ ($ACTUAL_VERSION) != tag version ($EXPECTED_VERSION)" >&2
            exit 1
          fi

      - name: Run Ruff & Pytest gate
        run: |
          ruff check .
          pytest -q

      - name: Build reproducible wheel, sdist & SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          rm -rf dist
          python -m build --sdist --wheel --outdir dist
          (
            cd dist
            sha256sum mivta-*.whl mivta-*.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Smoke-test built wheel in isolated venv
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/mivta-release-smoke
          /tmp/mivta-release-smoke/bin/pip install --no-cache-dir dist/mivta-*.whl
          OUT="$(/tmp/mivta-release-smoke/bin/python -I -m mivta --version)"
          echo "$OUT"
          [ "$OUT" = "mivta $EXPECTED_VERSION" ]

      - name: Upload wheel, sdist & SHA256SUMS to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/mivta-*.whl \
            dist/mivta-*.tar.gz \
            dist/SHA256SUMS \
            --clobber

  docker-ghcr:
    name: GHCR multi-arch image (amd64 + arm64)
    needs: release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-artifacts.outputs.tag }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute OCI tags & labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-artifacts.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-artifacts.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.release-artifacts.outputs.tag, '-') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
